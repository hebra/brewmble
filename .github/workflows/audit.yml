name: Security Audit

on:
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  push:
    branches:
      - main
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  schedule:
    - cron: '0 0 * * 0'

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [cli, daemon, rest]
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-audit --locked
      # Run inside the crate so cargo-audit loads its `.cargo/audit.toml`.
      - run: cargo audit
        working-directory: ${{ matrix.crate }}
